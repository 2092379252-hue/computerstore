<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - 电商平台</title>
    <link rel="stylesheet" href="/css/cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="cart-container">
        <div class="cart-header">
            <h1>我的购物车</h1>
            <button class="batch-delete-btn" id="batchDeleteBtn" disabled>
                <i class="fas fa-trash-alt"></i> 批量删除
            </button>
        </div>

        <div class="cart-content">
            <div class="cart-loading" id="cartLoading">
                <i class="fas fa-spinner fa-pulse"></i> 加载中...
            </div>
            <div class="cart-empty" id="cartEmpty" style="display: none;">
                <i class="fas fa-shopping-cart"></i>
                <p>购物车还是空的，去逛逛吧~</p>
                <a href="/web/products.html" class="continue-shopping">去购物</a>
            </div>
            <div class="cart-items-wrapper" id="cartItemsWrapper" style="display: none;">
                <div class="cart-items-header">
                    <label class="checkbox-all">
                        <input type="checkbox" id="selectAllCheckbox">
                        <span>全选</span>
                    </label>
                    <span class="item-info">商品信息</span>
                    <span class="item-price">单价</span>
                    <span class="item-quantity">数量</span>
                    <span class="item-subtotal">小计</span>
                    <span class="item-action">操作</span>
                </div>
                <div id="cartItemsList" class="cart-items-list"></div>
                <div class="cart-summary">
                    <div class="summary-left">
                        <span>已选 <span id="selectedCount">0</span> 件商品</span>
                        <span>总计：</span>
                        <span class="total-price" id="totalPrice">¥0.00</span>
                    </div>
                    <button class="checkout-btn" id="checkoutBtn">去结算</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 提示Toast -->
    <div id="toast" class="toast"></div>

    <script>
        // 购物车JavaScript逻辑
        (function() {
            // DOM元素
            const cartLoading = document.getElementById('cartLoading');
            const cartEmpty = document.getElementById('cartEmpty');
            const cartItemsWrapper = document.getElementById('cartItemsWrapper');
            const cartItemsList = document.getElementById('cartItemsList');
            const selectAllCheckbox = document.getElementById('selectAllCheckbox');
            const batchDeleteBtn = document.getElementById('batchDeleteBtn');
            const selectedCountSpan = document.getElementById('selectedCount');
            const totalPriceSpan = document.getElementById('totalPrice');
            const checkoutBtn = document.getElementById('checkoutBtn');

            let cartItems = []; // 存储购物车数据
            let selectedItems = new Set(); // 存储选中的购物车项ID

            // 显示提示消息
            function showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast show ${type}`;
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            // 加载购物车数据
            async function loadCart() {
                try {
                    cartLoading.style.display = 'flex';
                    cartEmpty.style.display = 'none';
                    cartItemsWrapper.style.display = 'none';

                    const response = await fetch('/api/cart/list');
                    const result = await response.json();
                    
                    if (result.code === 200 && result.data) {
                        cartItems = result.data;
                        if (cartItems.length === 0) {
                            showEmptyCart();
                        } else {
                            renderCart();
                        }
                    } else {
                        showToast('加载购物车失败：' + result.msg, 'error');
                        showEmptyCart();
                    }
                } catch (error) {
                    console.error('加载购物车错误:', error);
                    showToast('网络错误，请稍后重试', 'error');
                    showEmptyCart();
                } finally {
                    cartLoading.style.display = 'none';
                }
            }

            // 显示空购物车
            function showEmptyCart() {
                cartEmpty.style.display = 'flex';
                cartItemsWrapper.style.display = 'none';
            }

            // 渲染购物车
            function renderCart() {
                cartItemsWrapper.style.display = 'block';
                cartItemsList.innerHTML = '';
                
                cartItems.forEach(item => {
                    const cartItemDiv = createCartItemElement(item);
                    cartItemsList.appendChild(cartItemDiv);
                });
                
                updateSelectionSummary();
            }

            // 创建购物车项DOM元素
            function createCartItemElement(item) {
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.dataset.cartId = item.cartId;
                
                const isChecked = selectedItems.has(item.cartId);
                
                div.innerHTML = `
                    <div class="cart-item-checkbox">
                        <input type="checkbox" class="item-checkbox" data-cart-id="${item.cartId}" ${isChecked ? 'checked' : ''}>
                    </div>
                    <div class="cart-item-info">
                        <img src="${item.productImage || '/images/default-product.jpg'}" alt="${item.productName}" class="item-image">
                        <div class="item-details">
                            <h3>${escapeHtml(item.productName)}</h3>
                            <p class="item-sku">库存: ${item.stock}</p>
                        </div>
                    </div>
                    <div class="cart-item-price">¥${item.price.toFixed(2)}</div>
                    <div class="cart-item-quantity">
                        <button class="quantity-btn minus" data-cart-id="${item.cartId}">-</button>
                        <input type="number" class="quantity-input" data-cart-id="${item.cartId}" value="${item.quantity}" min="1" max="${item.stock}">
                        <button class="quantity-btn plus" data-cart-id="${item.cartId}">+</button>
                    </div>
                    <div class="cart-item-subtotal">¥${(item.price * item.quantity).toFixed(2)}</div>
                    <div class="cart-item-action">
                        <button class="delete-item-btn" data-cart-id="${item.cartId}">
                            <i class="fas fa-trash-alt"></i> 删除
                        </button>
                    </div>
                `;
                
                // 绑定事件
                const checkbox = div.querySelector('.item-checkbox');
                checkbox.addEventListener('change', () => handleItemSelect(item.cartId, checkbox.checked));
                
                const minusBtn = div.querySelector('.quantity-btn.minus');
                const plusBtn = div.querySelector('.quantity-btn.plus');
                const quantityInput = div.querySelector('.quantity-input');
                const deleteBtn = div.querySelector('.delete-item-btn');
                
                minusBtn.addEventListener('click', () => updateQuantity(item.cartId, item.quantity - 1, item.stock));
                plusBtn.addEventListener('click', () => updateQuantity(item.cartId, item.quantity + 1, item.stock));
                quantityInput.addEventListener('change', (e) => {
                    let newQuantity = parseInt(e.target.value);
                    if (isNaN(newQuantity)) newQuantity = 1;
                    newQuantity = Math.max(1, Math.min(newQuantity, item.stock));
                    updateQuantity(item.cartId, newQuantity, item.stock);
                });
                deleteBtn.addEventListener('click', () => deleteCartItem(item.cartId));
                
                return div;
            }

            // 处理商品选中
            function handleItemSelect(cartId, isChecked) {
                if (isChecked) {
                    selectedItems.add(cartId);
                } else {
                    selectedItems.delete(cartId);
                }
                updateSelectionSummary();
                updateSelectAllCheckbox();
            }

            // 更新选择汇总信息
            function updateSelectionSummary() {
                let selectedCount = 0;
                let totalPrice = 0;
                
                cartItems.forEach(item => {
                    if (selectedItems.has(item.cartId)) {
                        selectedCount += item.quantity;
                        totalPrice += item.price * item.quantity;
                    }
                });
                
                selectedCountSpan.textContent = selectedCount;
                totalPriceSpan.textContent = `¥${totalPrice.toFixed(2)}`;
                batchDeleteBtn.disabled = selectedItems.size === 0;
                
                // 更新每个项的复选框状态和样式
                document.querySelectorAll('.item-checkbox').forEach(checkbox => {
                    const cartId = parseInt(checkbox.dataset.cartId);
                    if (selectedItems.has(cartId)) {
                        checkbox.checked = true;
                    } else {
                        checkbox.checked = false;
                    }
                });
            }

            // 更新全选复选框状态
            function updateSelectAllCheckbox() {
                if (selectAllCheckbox) {
                    const allChecked = cartItems.length > 0 && selectedItems.size === cartItems.length;
                    selectAllCheckbox.checked = allChecked;
                    selectAllCheckbox.indeterminate = selectedItems.size > 0 && selectedItems.size < cartItems.length;
                }
            }

            // 全选/取消全选
            function handleSelectAll() {
                if (selectAllCheckbox.checked) {
                    cartItems.forEach(item => selectedItems.add(item.cartId));
                } else {
                    selectedItems.clear();
                }
                updateSelectionSummary();
            }

            // 更新商品数量
            async function updateQuantity(cartId, newQuantity, maxStock) {
                if (newQuantity < 1) newQuantity = 1;
                if (newQuantity > maxStock) {
                    showToast(`库存不足，最多购买${maxStock}件`, 'error');
                    return;
                }
                
                try {
                    const response = await fetch(`/api/cart/quantity/${cartId}?quantity=${newQuantity}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    const result = await response.json();
                    
                    if (result.code === 200) {
                        // 更新本地数据
                        const item = cartItems.find(i => i.cartId === cartId);
                        if (item) {
                            item.quantity = newQuantity;
                        }
                        // 重新渲染当前项的小计
                        const itemDiv = document.querySelector(`.cart-item[data-cart-id="${cartId}"]`);
                        if (itemDiv) {
                            const subtotalSpan = itemDiv.querySelector('.cart-item-subtotal');
                            if (subtotalSpan && item) {
                                subtotalSpan.textContent = `¥${(item.price * item.quantity).toFixed(2)}`;
                            }
                            const quantityInput = itemDiv.querySelector('.quantity-input');
                            if (quantityInput) quantityInput.value = newQuantity;
                        }
                        updateSelectionSummary();
                        showToast('更新数量成功');
                    } else {
                        showToast(result.msg || '更新失败', 'error');
                        // 重新加载以恢复正确数量
                        await loadCart();
                    }
                } catch (error) {
                    console.error('更新数量错误:', error);
                    showToast('网络错误', 'error');
                }
            }

            // 删除单个购物车项
            async function deleteCartItem(cartId) {
                if (!confirm('确定要删除这件商品吗？')) return;
                
                try {
                    const response = await fetch('/api/cart/items', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ cartIds: [cartId] })
                    });
                    const result = await response.json();
                    
                    if (result.code === 200) {
                        // 从本地数组中移除
                        const index = cartItems.findIndex(i => i.cartId === cartId);
                        if (index !== -1) {
                            cartItems.splice(index, 1);
                        }
                        selectedItems.delete(cartId);
                        
                        if (cartItems.length === 0) {
                            showEmptyCart();
                        } else {
                            renderCart();
                        }
                        showToast('删除成功');
                    } else {
                        showToast(result.msg || '删除失败', 'error');
                    }
                } catch (error) {
                    console.error('删除错误:', error);
                    showToast('网络错误', 'error');
                }
            }

            // 批量删除
            async function batchDelete() {
                if (selectedItems.size === 0) {
                    showToast('请先选择要删除的商品', 'error');
                    return;
                }
                
                if (!confirm(`确定要删除选中的 ${selectedItems.size} 件商品吗？`)) return;
                
                const cartIds = Array.from(selectedItems);
                try {
                    const response = await fetch('/api/cart/items', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ cartIds })
                    });
                    const result = await response.json();
                    
                    if (result.code === 200) {
                        // 移除已删除的项
                        cartItems = cartItems.filter(item => !selectedItems.has(item.cartId));
                        selectedItems.clear();
                        
                        if (cartItems.length === 0) {
                            showEmptyCart();
                        } else {
                            renderCart();
                        }
                        showToast('批量删除成功');
                    } else {
                        showToast(result.msg || '批量删除失败', 'error');
                    }
                } catch (error) {
                    console.error('批量删除错误:', error);
                    showToast('网络错误', 'error');
                }
            }

            // 去结算
            function checkout() {
                if (selectedItems.size === 0) {
                    showToast('请先选择要结算的商品', 'error');
                    return;
                }
                // 跳转到订单确认页
                const selectedCartIds = Array.from(selectedItems);
                const queryString = selectedCartIds.map(id => `cartIds=${id}`).join('&');
                window.location.href = `/web/order-confirm.html?${queryString}`;
            }

            // 简单防XSS
            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }

            // 初始化事件监听
            function initEventListeners() {
                if (selectAllCheckbox) {
                    selectAllCheckbox.addEventListener('change', handleSelectAll);
                }
                if (batchDeleteBtn) {
                    batchDeleteBtn.addEventListener('click', batchDelete);
                }
                if (checkoutBtn) {
                    checkoutBtn.addEventListener('click', checkout);
                }
            }

            // 初始化
            function init() {
                initEventListeners();
                loadCart();
            }

            init();
        })();
    </script>
</body>
</html>
