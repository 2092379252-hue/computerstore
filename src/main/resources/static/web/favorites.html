<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 - 电商平台</title>
    <link rel="stylesheet" href="/css/favorites.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="favorites-container">
        <div class="favorites-header">
            <h1>我的收藏</h1>
            <div class="header-buttons">
                <button class="batch-add-to-cart-btn" id="batchAddToCartBtn" disabled>
                    <i class="fas fa-cart-plus"></i> 批量加入购物车
                </button>
                <button class="batch-delete-btn" id="batchDeleteBtn" disabled>
                    <i class="fas fa-trash-alt"></i> 批量删除
                </button>
            </div>
        </div>

        <div class="favorites-content">
            <div class="favorites-loading" id="favoritesLoading">
                <i class="fas fa-spinner fa-pulse"></i> 加载中...
            </div>
            <div class="favorites-empty" id="favoritesEmpty" style="display: none;">
                <i class="far fa-heart"></i>
                <p>还没有收藏任何商品，去逛逛吧~</p >
                <a href=" " class="go-shopping">去购物</a >
            </div>
            <div class="favorites-grid" id="favoritesGrid" style="display: none;"></div>
        </div>
    </div>

    <!-- 提示Toast -->
    <div id="toast" class="toast"></div>

    <script>
        (function() {
            const favoritesLoading = document.getElementById('favoritesLoading');
            const favoritesEmpty = document.getElementById('favoritesEmpty');
            const favoritesGrid = document.getElementById('favoritesGrid');
            const batchAddToCartBtn = document.getElementById('batchAddToCartBtn');
            const batchDeleteBtn = document.getElementById('batchDeleteBtn');

            let favorites = [];
            let selectedFavorites = new Set();

            function showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast show ${type}`;
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            async function loadFavorites() {
                try {
                    favoritesLoading.style.display = 'flex';
                    favoritesEmpty.style.display = 'none';
                    favoritesGrid.style.display = 'none';

                    const response = await fetch('/api/favorites/list');
                    const result = await response.json();
                    
                    if (result.code === 200 && result.data) {
                        favorites = result.data;
                        if (favorites.length === 0) {
                            showEmptyFavorites();
                        } else {
                            renderFavorites();
                        }
                    } else {
                        showToast('加载收藏失败：' + result.msg, 'error');
                        showEmptyFavorites();
                    }
                } catch (error) {
                    console.error('加载收藏错误:', error);
                    showToast('网络错误，请稍后重试', 'error');
                    showEmptyFavorites();
                } finally {
                    favoritesLoading.style.display = 'none';
                }
            }

            function showEmptyFavorites() {
                favoritesEmpty.style.display = 'flex';
                favoritesGrid.style.display = 'none';
            }

            function renderFavorites() {
                favoritesGrid.style.display = 'grid';
                favoritesGrid.innerHTML = '';
                
                favorites.forEach(item => {
                    const card = createFavoriteCard(item);
                    favoritesGrid.appendChild(card);
                });
                
                updateBatchButtonsState();
            }

            function createFavoriteCard(item) {
                const card = document.createElement('div');
                card.className = 'favorite-card';
                card.dataset.favoriteId = item.favoriteId;
                
                const isChecked = selectedFavorites.has(item.favoriteId);
                
                card.innerHTML = `
                    <div class="favorite-checkbox">
                        <input type="checkbox" class="favorite-checkbox-input" data-favorite-id="${item.favoriteId}" ${isChecked ? 'checked' : ''}>
                    </div>
                    <div class="favorite-image">
                        < img src="${item.productImage || '/images/default-product.jpg'}" alt="${item.productName}">
                    </div>
                    <div class="favorite-info">
                        <h3 class="product-title">${escapeHtml(item.productName)}</h3>
                        <p class="product-price">¥${item.price.toFixed(2)}</p >
                        <p class="product-stock">库存: ${item.stock}</p >
                    </div>
                    <div class="favorite-actions">
                        <button class="add-to-cart-btn" data-favorite-id="${item.favoriteId}" data-product-id="${item.productId}">
                            <i class="fas fa-cart-plus"></i> 加入购物车
                        </button>
                        <button class="delete-favorite-btn" data-favorite-id="${item.favoriteId}">
                            <i class="fas fa-trash-alt"></i> 删除
                        </button>
                    </div>
                `;
                
                // 绑定事件
                const checkbox = card.querySelector('.favorite-checkbox-input');
                checkbox.addEventListener('change', () => handleFavoriteSelect(item.favoriteId, checkbox.checked));
                
                const addToCartBtn = card.querySelector('.add-to-cart-btn');
                addToCartBtn.addEventListener('click', () => addSingleToCart(item.favoriteId, item.productId));
                
                const deleteBtn = card.querySelector('.delete-favorite-btn');
                deleteBtn.addEventListener('click', () => deleteSingleFavorite(item.favoriteId));
                
                return card;
            }

            function handleFavoriteSelect(favoriteId, isChecked) {
                if (isChecked) {
                    selectedFavorites.add(favoriteId);
                } else {
                    selectedFavorites.delete(favoriteId);
                }
                updateBatchButtonsState();
                updateCheckboxState();
            }

            function updateBatchButtonsState() {
                const hasSelected = selectedFavorites.size > 0;
                batchAddToCartBtn.disabled = !hasSelected;
                batchDeleteBtn.disabled = !hasSelected;
            }

            function updateCheckboxState() {
                document.querySelectorAll('.favorite-checkbox-input').forEach(checkbox => {
                    const favoriteId = parseInt(checkbox.dataset.favoriteId);
                    checkbox.checked = selectedFavorites.has(favoriteId);
                });
            }

            // 单个加入购物车
            async function addSingleToCart(favoriteId, productId) {
                try {
                    const response = await fetch('/api/favorites/add-to-cart', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ favoriteIds: [favoriteId] })
                    });
                    const result = await response.json();
                    
                    if (result.code === 200) {
                        showToast('成功加入购物车');
                        // 可选：刷新收藏列表，显示是否移除
                        await loadFavorites();
                    } else {
                        showToast(result.msg || '加入购物车失败', 'error');
                    }
                } catch (error) {
                    console.error('加入购物车错误:', error);
                    showToast('网络错误', 'error');
                }
            }

            // 批量加入购物车
            async function batchAddToCart() {
                if (selectedFavorites.size === 0) {
                    showToast('请先选择要加入购物车的商品', 'error');
                    return;
                }
                
                const favoriteIds = Array.from(selectedFavorites);
                try {
                    const response = await fetch('/api/favorites/add-to-cart', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ favoriteIds })
                    });
                    const result = await response.json();
                    
                    if (result.code === 200) {
                        showToast(`成功加入${favoriteIds.length}件商品到购物车`);
                        // 刷新收藏列表
                        await loadFavorites();
                        selectedFavorites.clear();
                    } else {
                        showToast(result.msg || '批量加入购物车失败', 'error');
                    }
                } catch (error) {
                    console.error('批量加入购物车错误:', error);
                    showToast('网络错误', 'error');
                }
            }

            // 删除单个收藏
            async function deleteSingleFavorite(favoriteId) {
                if (!confirm('确定要删除这个收藏吗？')) return;
                
                try {
                    const response = await fetch('/api/favorites/items', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ favoriteIds: [favoriteId] })
                    });
                    const result = await response.json();
                    
                    if (result.code === 200) {
                        selectedFavorites.delete(favoriteId);
                        await loadFavorites();
                        showToast('删除成功');
                    } else {
                        showToast(result.msg || '删除失败', 'error');
                    }
                } catch (error) {
                    console.error('删除错误:', error);
                    showToast('网络错误', 'error');
                }
            }

            // 批量删除收藏
            async function batchDelete() {
                if (selectedFavorites.size === 0) {
                    showToast('请先选择要删除的收藏', 'error');
                    return;
                }
                
                if (!confirm(`确定要删除选中的 ${selectedFavorites.size} 个收藏吗？`)) return;
                
                const favoriteIds = Array.from(selectedFavorites);
                try {
                    const response = await fetch('/api/favorites/items', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ favoriteIds })
                    });
                    const result = await response.json();
                    
                    if (result.code === 200) {
                        selectedFavorites.clear();
                        await loadFavorites();
                        showToast('批量删除成功');
                    } else {
                        showToast(result.msg || '批量删除失败', 'error');
                    }
                } catch (error) {
                    console.error('批量删除错误:', error);
                    showToast('网络错误', 'error');
                }
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }

            function initEventListeners() {
                if (batchAddToCartBtn) {
                    batchAddToCartBtn.addEventListener('click', batchAddToCart);
                }
                if (batchDeleteBtn) {
                    batchDeleteBtn.addEventListener('click', batchDelete);
                }
            }

            function init() {
                initEventListeners();
                loadFavorites();
            }

            init();
        })();
    </script>
</body>
</html>
