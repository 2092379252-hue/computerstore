<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="renderer" content="webkit" />
    <title>电脑商城 - 编辑收货地址</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="../bootstrap3/js/holder.js"></script>
    <link href="../bootstrap3/css/bootstrap.css" rel="stylesheet" type="text/css">
    <script src="../bootstrap3/jquery-1.9.1.min.js"></script>
    <script src="../bootstrap3/js/bootstrap.js"></script>
    <link rel="stylesheet" href="../bootstrap3/font-awesome-4.7.0/css/font-awesome.css" />
    <link rel="stylesheet" type="text/css" href="../css/layout.css" />
    <link rel="stylesheet" type="text/css" href="../css/top.css" />
    <link rel="stylesheet" type="text/css" href="../css/footer.css" />
    <style>
        /* 提示样式 */
        .msg-box {
            padding: 8px 15px;
            border-radius: 4px;
            margin-left: 15px;
            margin-top: 5px;
            display: none;
        }
        .error-msg {
            color: #a94442;
            background-color: #f2dede;
            border: 1px solid #ebccd1;
        }
        .success-msg {
            color: #3c763d;
            background-color: #dff0d8;
            border: 1px solid #d6e9c6;
        }
        .loading {
            cursor: not-allowed;
            background-color: #999;
            border-color: #888;
        }
    </style>
    <script type="text/javascript">
        // 从URL获取参数
        function getUrlParam(name) {
            const reg = new RegExp(`(^|&)${name}=([^&]*)(&|$)`);
            const r = window.location.search.substr(1).match(reg);
            return r ? decodeURI(r[2]) : null;
        }

        // 获取地址详情并填充表单
        function showThisUserAddress() {
            const aid = getUrlParam('aid');
            if (!aid) {
                showMsg("未获取到地址ID，请返回列表页重新操作！", "error");
                return;
            }

            $.ajax({
                url: "/address/queryOneAddress",
                type: "get",
                data: { aid: aid },
                dataType: "json",
                success: function (res) {
                    if (!res || !res.data) {
                        showMsg("地址信息不存在！", "error");
                        return;
                    }
                    const address = res.data;
                    // 填充表单
                    $("#aid").val(address.aid)
                    $("#consigneesName").val(address.name)
                    $("#zip").val(address.zip)
                    $("#address").val(address.address)
                    $("#phone").val(address.phone)
                    $("#tel").val(address.tel)
                    $("#tag").val(address.tag)

                    // 先加载省份列表，再选中目标省市区
                    loadProvince(() => {
                        $("#province-list").val(address.provinceCode).trigger('change');
                        // 延迟加载城市和区县（等待省份change事件完成）
                        setTimeout(() => {
                            $("#city-list").val(address.cityCode).trigger('change');
                            setTimeout(() => {
                                $("#area-list").val(address.areaCode);
                            }, 300);
                        }, 300);
                    });
                },
                error: function (xhr, status, error) {
                    showMsg(`加载地址信息失败：${error || xhr.responseText || "服务器异常"}`, "error");
                }
            })
        }

        $(function () {
            // 引入公共组件
            $(".header").load("components/head.html")
            $(".footer").load("components/footer.html")
            $(".middleNavigation").load("components/middleNavigationBar.html")

            // 初始化省市区默认选项
            const provinceFirst = "<option value='0'>---- 选择省 ----</option>";
            const cityFirst = "<option value='0' >---- 选择市 ----</option>";
            const areaFirst = "<option value='0' >---- 选择区 ----</option>";
            $("#province-list").html(provinceFirst);
            $("#city-list").html(cityFirst);
            $("#area-list").html(areaFirst);

            // 标记数据是否已加载
            let provinceLoaded = false;
            let cityLoaded = false;
            let areaLoaded = false;

            // 加载省份列表
            function loadProvince(callback) {
                if (provinceLoaded) {
                    callback && callback();
                    return;
                }
                $.ajax({
                    url: "/district/parent",
                    type: "get",
                    data: { parent: 86 },
                    dataType: "json",
                    success: function (res) {
                        if (!res || !res.data) return;
                        let str = "";
                        res.data.forEach(district => {
                            str += `<option value="${district.code}">${district.name}</option>`;
                        });
                        $("#province-list").append(str);
                        provinceLoaded = true;
                        callback && callback();
                    },
                    error: function () {
                        showMsg("查询省份列表出错，请刷新重试！", "error");
                    }
                })
            }

            // 加载城市列表
            function loadCity(provinceCode) {
                if (provinceCode === "0") return;
                cityLoaded = false;
                $("#city-list").html(cityFirst);
                $.ajax({
                    url: "/district/parent",
                    type: "get",
                    data: { parent: provinceCode },
                    dataType: "json",
                    success: function (res) {
                        if (!res || !res.data) return;
                        let str = "";
                        res.data.forEach(district => {
                            str += `<option value="${district.code}">${district.name}</option>`;
                        });
                        $("#city-list").append(str);
                        cityLoaded = true;
                    },
                    error: function () {
                        showMsg("查询城市列表出错，请刷新重试！", "error");
                    }
                })
            }

            // 加载区县列表
            function loadArea(cityCode) {
                if (cityCode === "0") return;
                areaLoaded = false;
                $("#area-list").html(areaFirst);
                $.ajax({
                    url: "/district/parent",
                    type: "get",
                    data: { parent: cityCode },
                    dataType: "json",
                    success: function (res) {
                        if (!res || !res.data) return;
                        let str = "";
                        res.data.forEach(district => {
                            str += `<option value="${district.code}">${district.name}</option>`;
                        });
                        $("#area-list").append(str);
                        areaLoaded = true;
                    },
                    error: function () {
                        showMsg("查询区县列表出错，请刷新重试！", "error");
                    }
                })
            }

            // 统一提示消息方法
            function showMsg(content, type) {
                const $msgBox = $("#msg-box");
                $msgBox.removeClass("error-msg success-msg").addClass(`${type}-msg`)
                       .html(content).show();
                setTimeout(() => $msgBox.hide(), 3000);
            }

            // 邮政编码校验
            function checkZip(zip) {
                if (zip === "") return true;
                const reg = /^[0-9]{6}$/;
                return reg.test(zip);
            }

            // 固话校验
            function checkTel(tel) {
                if (tel === "") return true;
                const reg = /^0\d{2,3}-\d{7,8}$/;
                return reg.test(tel);
            }

            // 手机号校验（兼容最新号段）
            function checkPhone(phone) {
                const reg = /^1[3-9]\d{9}$/;
                return reg.test(phone);
            }

            // 省下拉框事件
            $("#province-list").on('click', function () {
                loadProvince();
            }).on('change', function () {
                const provinceCode = $(this).val();
                $("#city-list").html(cityFirst);
                $("#area-list").html(areaFirst);
                cityLoaded = false;
                areaLoaded = false;
                loadCity(provinceCode);
            });

            // 市下拉框事件
            $("#city-list").on('change', function () {
                const cityCode = $(this).val();
                $("#area-list").html(areaFirst);
                areaLoaded = false;
                loadArea(cityCode);
            });

            // 重置按钮事件
            $("#resetInfo").click(function () {
                if (confirm("确定要恢复原始地址信息吗？")) {
                    location.reload();
                }
            })

            // 修改地址提交事件
            $("#updateAddress").click(function () {
                const $btn = $(this);
                if ($btn.hasClass("loading")) return;

                // 获取表单值
                const name = $("#consigneesName").val().trim();
                const phone = $("#phone").val().trim();
                const provinceCode = $("#province-list").val();
                const cityCode = $("#city-list").val();
                const areaCode = $("#area-list").val();
                const address = $("#address").val().trim();
                const zip = $("#zip").val().trim();
                const tel = $("#tel").val().trim();

                // 表单校验
                if (!name) {
                    showMsg("请填写收货人姓名！", "error");
                    return;
                }
                if (!phone) {
                    showMsg("请填写手机号！", "error");
                    return;
                }
                if (!checkPhone(phone)) {
                    showMsg("手机号格式不正确（请输入11位有效手机号）！", "error");
                    return;
                }
                if (provinceCode === "0" || cityCode === "0" || areaCode === "0") {
                    showMsg("请选择完整的省市区信息！", "error");
                    return;
                }
                if (!address) {
                    showMsg("请填写详细收货地址！", "error");
                    return;
                }
                if (!checkZip(zip)) {
                    showMsg("邮政编码格式错误（6位数字）！", "error");
                    return;
                }
                if (!checkTel(tel)) {
                    showMsg("固话格式错误（示例：010-12345678）！", "error");
                    return;
                }

                // 提交表单
                $btn.addClass("loading").val("修改中...").prop("disabled", true);
                $.ajax({
                    url: "/address/updateAddress",
                    type: "post",
                    data: $("#form-update-address").serialize(),
                    dataType: "json",
                    success: function (res) {
                        if (res && res.status === 200) {
                            showMsg("修改地址成功！即将返回列表页...", "success");
                            setTimeout(() => {
                                location.href = "address.html";
                            }, 1500);
                        } else {
                            showMsg(res?.message || "修改地址失败！", "error");
                            $btn.removeClass("loading").val("修改").prop("disabled", false);
                        }
                    },
                    error: function (xhr, status, error) {
                        showMsg(`修改失败：${error || xhr.responseText || "服务器异常"}`, "error");
                        $btn.removeClass("loading").val("修改").prop("disabled", false);
                    }
                })
            });

            // 加载地址信息
            showThisUserAddress();
        })
    </script>
</head>
<body>
    <!--头部-->
    <div class="header"></div>
    <!--中间导航条-->
    <div class="middleNavigation"></div>

    <div class="container">
        <div class="col-md-2">
            <!--左侧导航-->
            <div class="panel-group" id="accordion">
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <p class="panel-title">
                            <a data-toggle="collapse" data-parent="#accordion" href="#collapseOne">我的订单</a>
                        </p>
                    </div>
                    <div id="collapseOne" class="panel-collapse collapse">
                        <div class="panel-body">
                            <div><a href="orders.html">全部订单</a></div>
                            <div><a href="orders.html">待付款</a></div>
                            <div><a href="orders.html">待收货</a></div>
                            <div><a href="orders.html">待评价</a></div>
                            <div><a href="orders.html">退货退款</a></div>
                        </div>
                    </div>
                </div>
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <p class="panel-title">
                            <a data-toggle="collapse" data-parent="#accordion" href="#collapseTwo">资料修改</a>
                        </p>
                    </div>
                    <div id="collapseTwo" class="panel-collapse collapse in">
                        <div class="panel-body">
                            <div><a href="password.html">修改密码</a></div>
                            <div><a href="userdata.html">个人资料</a></div>
                            <div><a href="upload.html">上传头像</a></div>
                            <div><a href="address.html"><b>收货管理</b></a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-10">
            <div class="panel panel-default">
                <ul class="nav nav-tabs">
                    <li><a href="password.html">修改密码</a></li>
                    <li><a href="userdata.html">个人资料</a></li>
                    <li><a href="upload.html">上传头像</a></li>
                    <li class="active"><a href="#">收货管理</a></li>
                </ul>
                <div class="panel-body">
                    <!--修改收货地址表单-->
                    <form id="form-update-address" class="form-horizontal" role="form">
                        <div class="form-group">
                            <label class="col-md-2 control-label"></label>
                            <label class="col-md-4 control-label" style="color: red;font-size: larger">修改地址</label>
                        </div>
                        <div class="form-group">
                            <label class="col-md-2 control-label"><span class="txtred">*</span>收货人：</label>
                            <div class="col-md-8">
                                <input id="aid" name="aid" type="hidden" />
                                <input id="consigneesName" name="name" type="text" class="form-control" placeholder="请输入收货人姓名">
                            </div>
                        </div>
                        <div class="address_content" data-toggle="distpicker">
                            <div class="form-group">
                                <label class="col-md-2 control-label"><span class="txtred">*</span>省/直辖市：</label>
                                <div class="col-md-3">
                                    <select id="province-list" name="provinceCode" class="form-control"></select>
                                </div>
                                <label class="col-md-2 control-label"><span class="txtred">*</span>城市：</label>
                                <div class="col-md-3">
                                    <select id="city-list" name="cityCode" class="form-control"></select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-md-2 control-label"><span class="txtred">*</span>区县：</label>
                                <div class="col-md-3">
                                    <select id="area-list" name="areaCode" class="form-control"></select>
                                </div>
                                <label class="col-md-2 control-label">邮政编码：</label>
                                <div class="col-md-3">
                                    <input id="zip" name="zip" type="text" class="form-control" placeholder="请输入6位数字邮政编码">
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-2 control-label"><span class="txtred">*</span>详细地址：</label>
                            <div class="col-md-8">
                                <textarea id="address" name="address" class="form-control" rows="3" placeholder="输入详细的收货地址，小区名称、门牌号等"></textarea>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-2 control-label"><span class="txtred">*</span>手机：</label>
                            <div class="col-md-3">
                                <input id="phone" name="phone" type="text" class="form-control" placeholder="请输入手机号码">
                            </div>
                            <label class="col-md-2 control-label">固话：</label>
                            <div class="col-md-3">
                                <input id="tel" name="tel" type="text" class="form-control" placeholder="格式：010-12345678">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-2 control-label">地址类型：</label>
                            <div class="col-md-8">
                                <input id="tag" name="tag" type="text" class="form-control" placeholder="请输入地址类型，如：家、公司或者学校">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-2 control-label"><a href="address.html">返回</a></label>
                            <div class="col-sm-10">
                                <input id="updateAddress" type="button" class="col-md-1 btn btn-primary" value="修改" />
                                <input id="resetInfo" type="button" class="col-md-offset-1 col-md-2 btn btn-primary" value="恢复原地址信息" />
                                <!-- 提示框 -->
                                <div id="msg-box" class="msg-box pull-left"></div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="clearfix"></div>
    <!--页脚-->
    <div class="footer"></div>
</body>
</html>
