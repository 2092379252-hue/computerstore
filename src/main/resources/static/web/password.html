<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="renderer" content="webkit" />
    <title>电脑商城 - 修改密码</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="../bootstrap3/js/holder.js"></script>
    <link href="../bootstrap3/css/bootstrap.css" rel="stylesheet" type="text/css">
    <script src="../bootstrap3/jquery-1.9.1.min.js"></script>
    <script src="../bootstrap3/js/bootstrap.js"></script>
    <link rel="stylesheet" href="../bootstrap3/font-awesome-4.7.0/css/font-awesome.css" />
    <link rel="stylesheet" type="text/css" href="../css/layout.css" />
    <link rel="stylesheet" type="text/css" href="../css/top.css" />
    <link rel="stylesheet" type="text/css" href="../css/footer.css" />
    <script src="../js/someFunction.js" type="text/javascript" charset="UTF-8"></script>
    <style>
        .password-strength {
            height: 8px;
            margin-top: 5px;
            display: none;
        }
        .strength-weak { background: #ff4444; width: 30%; }
        .strength-middle { background: #ffcc00; width: 60%; }
        .strength-strong { background: #00cc00; width: 100%; }
        .loading { display: none; margin-left: 10px; }
    </style>
    <script type="text/javascript">
        // 错误次数限制
        let errorCount = 0;
        const MAX_ERROR_COUNT = 3;
        
        // 密码强度检测
        function checkPwdStrength(pwd) {
            const strengthBar = $("#pwd-strength");
            strengthBar.show();
            if (pwd.length < 6) {
                strengthBar.removeClass().addClass("password-strength strength-weak");
                $("#strength-text").text("弱").css("color", "#ff4444");
            } else if (pwd.match(/[a-zA-Z]/) && pwd.match(/[0-9]/)) {
                if (pwd.length >= 8 && pwd.match(/[^a-zA-Z0-9]/)) {
                    strengthBar.removeClass().addClass("password-strength strength-strong");
                    $("#strength-text").text("强").css("color", "#00cc00");
                } else {
                    strengthBar.removeClass().addClass("password-strength strength-middle");
                    $("#strength-text").text("中").css("color", "#ffcc00");
                }
            } else {
                strengthBar.removeClass().addClass("password-strength strength-weak");
                $("#strength-text").text("弱").css("color", "#ff4444");
            }
        }

        $(function () {
            // 加载公共组件
            $(".header").load("components/head.html")
            $(".footer").load("components/footer.html")
            $(".middleNavigation").load("components/middleNavigationBar.html")

            // 密码强度实时检测
            $("#password").on("input", function () {
                const pwd = $(this).val();
                if (pwd) {
                    checkPwdStrength(pwd);
                } else {
                    $("#pwd-strength").hide();
                    $("#strength-text").empty();
                }
            });

            // 重置表单
            $("#btn-reset").click(function () {
                $("#form-change-password")[0].reset();
                $("#error-msg").empty();
                $("#pwd-strength").hide();
                $("#strength-text").empty();
            });

            // 修改密码提交
            $("#btn-change-password").click(function () {
                // 防重复提交
                if ($(this).hasClass("disabled")) return;
                
                // 错误次数超限
                if (errorCount >= MAX_ERROR_COUNT) {
                    $("#error-msg").text("原密码错误次数过多，请5分钟后再试！");
                    $("#btn-change-password").addClass("disabled");
                    return false;
                }

                // 空值验证
                if ($("#oldPwd").val() == "" || $("#password").val() == "" || $("#rePwd").val() == "") {
                    $("#error-msg").text("请填写完信息后再提交！");
                    return false;
                }

                // 密码规则验证
                let passCheck = /^\w{5,12}$/;
                let password = $("#password").val();
                if (!passCheck.test(password)) {
                    $("#error-msg").text("新密码必须是5-12位的字母、数字或下划线");
                    return false;
                } else {
                    $("#error-msg").empty()
                }

                // 确认密码验证
                let rePass = $("#rePwd").val();
                if (rePass !== password) {
                    $("#error-msg").text("两次输入的密码不一致");
                    return false;
                } else {
                    $("#error-msg").empty()
                }

                // 提交状态处理
                $(this).addClass("disabled").val("提交中...");
                $(".loading").show();

                // 提交请求
                $.ajax({
                    url: "/user/resetPassword",
                    type: "post",
                    data: $("#form-change-password").serialize(),
                    dataType: "json",
                    success: function (res) {
                        if (res.status === 200) {
                            alert("密码已更改成功，请重新登录")
                            location.href = "login.html"
                        } else {
                            $("#error-msg").html(res.message);
                            errorCount++; // 错误次数+1
                        }
                    },
                    error: function (error) {
                        $("#error-msg").text(error.status + "错误,服务器出现故障，请等待修复！");
                    },
                    complete: function () {
                        // 恢复按钮状态
                        $("#btn-change-password").removeClass("disabled").val("修改");
                        $(".loading").hide();
                    }
                })
            })
        })
    </script>
</head>
<body>
    <!--头部-->
    <div class="header"></div>
    <!--中间导航条-->
    <div class="middleNavigation"></div>

    <div class="container">
        <div class="col-md-2">
            <!--左侧导航-->
            <div class="panel-group" id="accordion">
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <p class="panel-title">
                            <a data-toggle="collapse" data-parent="#accordion" href="#collapseOne">我的订单</a>
                        </p>
                    </div>
                    <div id="collapseOne" class="panel-collapse collapse">
                        <div class="panel-body">
                            <div><a href="orders.html">全部订单</a></div>
                            <div><a href="orders.html">待付款</a></div>
                            <div><a href="orders.html">待收货</a></div>
                            <div><a href="orders.html">待评价</a></div>
                            <div><a href="orders.html">退货退款</a></div>
                        </div>
                    </div>
                </div>
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <p class="panel-title">
                            <a data-toggle="collapse" data-parent="#accordion" href="#collapseTwo">资料修改</a>
                        </p>
                    </div>
                    <div id="collapseTwo" class="panel-collapse collapse in">
                        <div class="panel-body">
                            <div><a href="password.html"><b>修改密码</b></a></div>
                            <div><a href="userdata.html">个人资料</a></div>
                            <div><a href="upload.html">上传头像</a></div>
                            <div><a href="address.html">收货管理</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-10">
            <div class="panel panel-default">
                <ul class="nav nav-tabs">
                    <li class="active"><a href="#">修改密码</a></li>
                    <li><a href="userdata.html">个人资料</a></li>
                    <li><a href="upload.html">上传头像</a></li>
                    <li><a href="address.html">收货管理</a></li>
                </ul>
                <div class="panel-body">
                    <!--修改密码表单-->
                    <form id="form-change-password" class="form-horizontal" role="form">
                        <div class="form-group">
                            <label class="col-md-2 control-label">原密码：</label>
                            <div class="col-md-4">
                                <input id="oldPwd" name="oldPassword" type="password" class="form-control" placeholder="请输入原密码">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-2 control-label">新密码：</label>
                            <div class="col-md-4">
                                <input id="password" name="newPassword" type="password" class="form-control" placeholder="请输入新密码">
                                <div id="pwd-strength" class="password-strength"></div>
                                <span id="strength-text" style="font-size: 12px;"></span>
                            </div>
                            <img id="img" onclick="showPasswordOrNot('password','img')" src="../images/img/open.jpeg" style="width: 20px;padding-top: 5px;">
                        </div>
                        <div class="form-group">
                            <label class="col-md-2 control-label">确认密码：</label>
                            <div class="col-md-4">
                                <input id="rePwd" type="password" class="form-control" placeholder="请再次输入新密码">
                            </div>
                            <img id="rePwdImg" onclick="showPasswordOrNot('rePwd','rePwdImg')" src="../images/img/open.jpeg" style="width: 20px;padding-top: 5px;">
                        </div>
                        <div class="form-group">
                            <div class="col-sm-offset-2 col-sm-1">
                                <input id="btn-change-password" type="button" class="btn btn-primary" value="修改" />
                                <span class="loading"><i class="fa fa-spinner fa-spin"></i></span>
                            </div>
                            <div class="col-sm-2">
                                <input id="btn-reset" type="button" class="btn btn-default" value="重置" />
                            </div>
                            <div id="error-msg" class="col-sm-6" style="color: red;font-weight:bold;padding-top: 5px"></div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="clearfix"></div>
    <!--页脚-->
    <div class="footer"></div>
</body>
</html>
