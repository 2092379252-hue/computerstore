<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="renderer" content="webkit" />
    <title>电脑商城 - 收货管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="../bootstrap3/js/holder.js"></script>
    <link href="../bootstrap3/css/bootstrap.css" rel="stylesheet" type="text/css">
    <script src="../bootstrap3/jquery-1.9.1.min.js"></script>
    <script src="../bootstrap3/js/bootstrap.js"></script>
    <link rel="stylesheet" href="../bootstrap3/font-awesome-4.7.0/css/font-awesome.css" />
    <link rel="stylesheet" type="text/css" href="../css/layout.css" />
    <link rel="stylesheet" type="text/css" href="../css/top.css" />
    <link rel="stylesheet" type="text/css" href="../css/footer.css" />
    <style>
        .default-tag {
            background: #ff4444;
            color: #fff;
            font-size: 12px;
            padding: 2px 5px;
            border-radius: 3px;
        }
    </style>
    <script type="text/javascript">
        function updateAddress(aid) {
            location.href = "editAddress.html?aid=" + aid;
        }

        function deleteAddress(aid, isDefault) {
            if (isDefault === 1) {
                alert("默认地址不能删除！");
                return;
            }
            if (confirm("确定要删除该收货地址吗？删除后不可恢复！")) {
                $.ajax({
                    url: "/address/deleteAddress",
                    type: "post",
                    data: { aid: aid },
                    dataType: "json",
                    success: function (res) {
                        alert("删除成功！");
                        location.reload();
                    },
                    error: function () {
                        alert("删除失败！");
                    }
                });
            }
        }

        function setDefault(aid) {
            if (confirm("确定要将该地址设为默认吗？")) {
                $.post("/address/setAddress", { aid: aid }, function () {
                    alert("设置成功！");
                    location.reload();
                });
            }
        }

        function searchAddress() {
            var keyword = $("#search-input").val().toLowerCase();
            $("#address-list tr").each(function () {
                var text = $(this).text().toLowerCase();
                $(this).toggle(text.indexOf(keyword) > -1);
            });
        }

        $(function () {
            $(".header").load("components/head.html")
            $(".footer").load("components/footer.html")
            $(".middleNavigation").load("components/middleNavigationBar.html")

            // ====================== 以下是唯一修复的部分 ======================
            $.ajax({
                url: "/address",
                type: "get",
                data: { _: new Date().getTime() }, // 强制不缓存
                dataType: "json",
                success: function (res) {
                    var $list = $("#address-list");
                    $list.empty();
                    var list = res.data || [];

                    if (list.length === 0) {
                        $list.html('<tr><td colspan="7" align="center">暂无收货地址</td></tr>');
                        return;
                    }

                    // 修复 forEach 崩溃，改用最安全的 for 循环
                    for (var i = 0; i < list.length; i++) {
                        var a = list[i];
                        var def = a.isDefault === 1;
                        var tr = "<tr>";
                        tr += "<td>" + (a.tag || "") + (def ? " <span class='default-tag'>默认</span>" : "") + "</td>";
                        tr += "<td>" + (a.name || "") + "</td>";
                        tr += "<td>" + (a.provinceName || "") + (a.cityName || "") + (a.areaName || "") + (a.address || "") + "</td>";
                        tr += "<td>" + (a.phone || "") + "</td>";
                        tr += "<td><a href='javascript:updateAddress(" + a.aid + ")' class='btn btn-xs btn-info'>修改</a></td>";
                        tr += "<td><a href='javascript:deleteAddress(" + a.aid + "," + a.isDefault + ")' class='btn btn-xs btn-danger'>删除</a></td>";
                        tr += "<td>" + (def ? "默认地址" : "<a href='javascript:setDefault(" + a.aid + ")' class='btn btn-xs btn-default'>设为默认</a>") + "</td>";
                        tr += "</tr>";
                        $list.append(tr);
                    }
                },
                error: function () {
                    $("#address-list").html('<tr><td colspan="7" align="center">加载失败</td></tr>');
                }
            });
            // ====================== 修复结束 ======================

            $("#search-btn").click(searchAddress);
            $("#search-input").keyup(function (e) {
                if (e.keyCode === 13) searchAddress();
            });
        })
    </script>
</head>
<body>
    <div class="header"></div>
    <div class="middleNavigation"></div>
    <div class="container">
        <div class="col-md-2">
            <div class="panel-group" id="accordion">
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <p class="panel-title">
                            <a data-toggle="collapse" data-parent="#accordion" href="#collapseOne">我的订单</a>
                        </p>
                    </div>
                    <div id="collapseOne" class="panel-collapse collapse">
                        <div class="panel-body">
                            <div><a href="orders.html">全部订单</a></div>
                            <div><a href="orders.html">待付款</a></div>
                            <div><a href="orders.html">待收货</a></div>
                            <div><a href="orders.html">待评价</a></div>
                            <div><a href="orders.html">退货退款</a></div>
                        </div>
                    </div>
                </div>
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <p class="panel-title">
                            <a data-toggle="collapse" data-parent="#accordion" href="#collapseTwo">资料修改</a>
                        </p>
                    </div>
                    <div id="collapseTwo" class="panel-collapse collapse in">
                        <div class="panel-body">
                            <div><a href="password.html">修改密码</a></div>
                            <div><a href="userdata.html">个人资料</a></div>
                            <div><a href="upload.html">上传头像</a></div>
                            <div><a href="address.html"><b>收货管理</b></a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-10">
            <div class="panel panel-default">
                <ul class="nav nav-tabs">
                    <li><a href="password.html">修改密码</a></li>
                    <li><a href="userdata.html">个人资料</a></li>
                    <li><a href="upload.html">上传头像</a></li>
                    <li class="active"><a href="#">收货管理</a></li>
                </ul>
                <div class="panel-body">
                    <div class="form-inline" style="margin-bottom:10px;">
                        <input id="search-input" type="text" class="form-control" placeholder="搜索地址/姓名/电话">
                        <button id="search-btn" class="btn btn-default btn-sm">搜索</button>
                    </div>
                    <table class="table table-striped table-hover">
                        <caption class="text-left">收货地址列表</caption>
                        <thead>
                            <tr>
                                <th>地址类型</th>
                                <th>收货人</th>
                                <th>详细地址</th>
                                <th>联系电话</th>
                                <th colspan="3">操作</th>
                            </tr>
                        </thead>
                        <tbody id="address-list">
                            <tr>
                                <td colspan="7" align="center"><i class="fa fa-spinner fa-spin"></i> 加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                    <a href="addAddress.html" class="btn btn-sm btn-primary"><span class="fa fa-plus"></span> 新增收货地址</a>
                </div>
            </div>
        </div>
    </div>
    <div class="footer"></div>
</body>
</html>
