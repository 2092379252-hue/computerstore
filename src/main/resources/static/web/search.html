<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="renderer" content="webkit" />
	<title>搜索结果 · 电脑商城</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- Bootstrap 3 & jQuery -->
	<link href="../bootstrap3/css/bootstrap.css" rel="stylesheet" type="text/css">
	<script src="../bootstrap3/jquery-1.9.1.min.js"></script>
	<script src="../bootstrap3/js/bootstrap.js"></script>
	<!-- 字体图标 -->
	<link rel="stylesheet" href="../bootstrap3/font-awesome-4.7.0/css/font-awesome.css" />
	<!-- 全局样式 -->
	<link rel="stylesheet" type="text/css" href="../css/layout.css" />
	<link rel="stylesheet" type="text/css" href="../css/top.css" />
	<link rel="stylesheet" type="text/css" href="../css/footer.css" />
	<!-- 搜索页样式 -->
	<link rel="stylesheet" type="text/css" href="../css/search.css" />
	<!-- 其他 -->
	<link rel="stylesheet" type="text/css" href="../css/imgmove.css" />
	<script src="../js/imgmove.js" type="text/javascript" charset="utf-8"></script>
	<script src="../js/someFunction.js" type="text/javascript" charset="utf-8"></script>
	<script src="../js/herf.js" type="text/javascript" charset="utf-8"></script>

	<script type="text/javascript">
		// 获取上个页面传来的搜索关键字和分页参数
		var title = getOne();
		title = title.substring(0, title.indexOf("&"));
		var num = getUrlParam("pageNum");
		var minPriceParam = getUrlParam("minPrice");
		var maxPriceParam = getUrlParam("maxPrice");

		// 全局分页参数
		var pageNum = 0, pageSize = 0, prePage = 0, nextPage = 0;
		var navigatepageNums = [];
		var currentProductList = [];
		var currentMinPrice = minPriceParam ? parseInt(minPriceParam) : null;
		var currentMaxPrice = maxPriceParam ? parseInt(maxPriceParam) : null;

		// 根据分页条的选择进行查询（保留价格筛选条件）
		function PaginationListSelect(pNum, pSize) {
			var keyword = $("#search").val();
			var url = "/web/search.html?title=" + encodeURIComponent(keyword) + "&pageNum=" + pNum + "&pageSize=" + pSize;
			if (currentMinPrice !== null && currentMinPrice !== '') url += "&minPrice=" + currentMinPrice;
			if (currentMaxPrice !== null && currentMaxPrice !== '') url += "&maxPrice=" + currentMaxPrice;
			location.href = url;
		}

		// 加入收藏
		function addToCollect(pid, btnElement) {
			if (sessionStorage.getItem("user") == null) {
				alert("您尚未登录，请先登录！");
				location.href = "login.html";
				return false;
			}
			var $btn = $(btnElement);
			if ($btn.hasClass("favorited")) {
				alert("该商品已在收藏夹中");
				return;
			}
			if (confirm("确定要加入收藏吗？")) {
				$.ajax({
					url: "/favorites/addFavorites",
					type: "post",
					data: { pid: pid },
					dataType: "json",
					success: function(res) {
						alert("收藏成功！");
						$btn.addClass("favorited").html('<i class="fa fa-heart"></i> 已收藏');
					},
					error: function() { alert("收藏失败，请稍后重试"); }
				});
			}
		}

		// 加入购物车
		function addToCart(pid, price) {
			if (sessionStorage.getItem("user") == null) {
				alert("您尚未登录，请先登录！");
				location.href = "login.html";
				return false;
			}
			if (confirm("确定要将此商品加入购物车吗？")) {
				$.ajax({
					url: "/cart/addCart",
					type: "post",
					data: { pid: pid, price: price, num: 1 },
					dataType: "json",
					success: function(res) {
						if (res.status === 200) alert("已成功加入购物车，在购物车等您结算哟！");
					},
					error: function() { alert("加入购物车失败，请稍后重试"); }
				});
			}
		}

		// 前端排序
		function sortProducts(sortType) {
			if (!currentProductList.length) return;
			var sorted = [...currentProductList];
			if (sortType === 'price-asc') sorted.sort((a,b) => a.price - b.price);
			else if (sortType === 'price-desc') sorted.sort((a,b) => b.price - a.price);
			else if (sortType === 'sales') sorted.sort((a,b) => (b.sales || 0) - (a.sales || 0));
			else sorted.sort((a,b) => a.id - b.id);
			renderProductList(sorted);
			$(".sort-btn").removeClass("active");
			if (sortType === 'default') $("#sort-default").addClass("active");
			else if (sortType === 'price-asc') $("#sort-price-asc").addClass("active");
			else if (sortType === 'price-desc') $("#sort-price-desc").addClass("active");
			else if (sortType === 'sales') $("#sort-sales").addClass("active");
		}

		// 渲染商品列表
		function renderProductList(products) {
			$("#productList").empty();
			if (!products || products.length === 0) {
				$("#productList").html('<div class="col-md-12"><div class="no-result">暂无相关商品，试试其他关键词吧~</div></div>');
				return;
			}
			var html = '';
			for (var i = 0; i < products.length; i++) {
				var p = products[i];
				var imgUrl = ".." + p.image + "1_big.png";
				html += `
                    <div class="col-md-3 col-sm-4 col-xs-6">
                        <div class="product-card">
                            <a href="product.html?id=${p.id}" class="card-img-link">
                                <img src="${imgUrl}" class="card-img" alt="${p.title}">
                            </a>
                            <div class="card-info">
                                <a href="product.html?id=${p.id}" class="card-title text-row-2">${escapeHtml(p.title)}</a>
                                <div class="card-price">¥${p.price}</div>
                                <div class="card-sales">销量 ${p.sales || 0}件</div>
                                <div class="card-actions">
                                    <button class="btn-cart" onclick="addToCart(${p.id}, ${p.price})">
                                        <i class="fa fa-cart-plus"></i> 购物车
                                    </button>
                                    <button class="btn-fav" onclick="addToCollect(${p.id}, this)">
                                        <i class="fa fa-heart-o"></i> 收藏
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
			}
			$("#productList").html(html);
		}

		function escapeHtml(str) {
			if (!str) return '';
			return str.replace(/[&<>]/g, function(m) {
				if (m === '&') return '&amp;';
				if (m === '<') return '&lt;';
				if (m === '>') return '&gt;';
				return m;
			});
		}

		// 填充分页条
		function addPaginationData(res) {
			$("#PaginationList").empty();
			pageNum = res.data.pageNum;
			pageSize = res.data.pageSize;
			prePage = res.data.prePage;
			nextPage = res.data.nextPage;
			navigatepageNums = res.data.navigatepageNums || [];

			var ul = $('<ul class="pagination pagination-sm"></ul>');
			if (res.data.isFirstPage) {
				ul.append('<li class="disabled"><span>«</span></li>');
			} else {
				ul.append(`<li><a href="javascript:void(0)" onclick="PaginationListSelect(${prePage}, ${pageSize})">«</a></li>`);
			}
			for (var i = 0; i < navigatepageNums.length; i++) {
				var p = navigatepageNums[i];
				if (p === pageNum) {
					ul.append(`<li class="active"><span>${p}</span></li>`);
				} else {
					ul.append(`<li><a href="javascript:void(0)" onclick="PaginationListSelect(${p}, ${pageSize})">${p}</a></li>`);
				}
			}
			if (res.data.isLastPage) {
				ul.append('<li class="disabled"><span>»</span></li>');
			} else {
				ul.append(`<li><a href="javascript:void(0)" onclick="PaginationListSelect(${nextPage}, ${pageSize})">»</a></li>`);
			}
			$("#PaginationList").append(ul);
		}

		// 请求搜索数据（支持价格区间）
		function searchByTitle(pageNum, pageSize, title, minPrice, maxPrice) {
			var url = "/product/" + pageNum + "/" + pageSize + "/" + encodeURIComponent(title);
			var params = [];
			if (minPrice !== null && minPrice !== undefined && minPrice !== '') params.push("minPrice=" + minPrice);
			if (maxPrice !== null && maxPrice !== undefined && maxPrice !== '') params.push("maxPrice=" + maxPrice);
			if (params.length) url += "?" + params.join("&");

			$.ajax({
				url: url,
				dataType: "json",
				success: function(res) {
					if (res.data.list && res.data.list.length > 0) {
						$("#search").val(title);
						currentProductList = res.data.list;
						renderProductList(currentProductList);
						addPaginationData(res);
						bindSortEvents();
					} else {
						$("#search").val(title);
						$("#productList").html('<div class="col-md-12"><div class="no-result">抱歉，没有找到与 "' + title + '" 相关的商品</div></div>');
						$("#PaginationList").empty();
					}
				},
				error: function() {
					$("#productList").html('<div class="col-md-12"><div class="no-result">网络错误，请稍后重试</div></div>');
				}
			});
		}

		// 价格筛选（select下拉框）
		function initPriceSelect() {
			$("#priceFilterSelect").on('change', function() {
				var val = $(this).val();
				var minPrice = null, maxPrice = null;
				if (val === "0-3000") {
					minPrice = 0;
					maxPrice = 3000;
				} else if (val === "3000-6000") {
					minPrice = 3000;
					maxPrice = 6000;
				} else if (val === "6000+") {
					minPrice = 6000;
					maxPrice = 999999;
				}
				currentMinPrice = minPrice;
				currentMaxPrice = maxPrice;
				searchByTitle(1, 12, $("#search").val(), currentMinPrice, currentMaxPrice);
			});
		}

		function setActiveFilter() {
			if (currentMinPrice === 0 && currentMaxPrice === 3000) {
				$("#priceFilterSelect").val("0-3000");
			} else if (currentMinPrice === 3000 && currentMaxPrice === 6000) {
				$("#priceFilterSelect").val("3000-6000");
			} else if (currentMinPrice === 6000 && currentMaxPrice === 999999) {
				$("#priceFilterSelect").val("6000+");
			} else {
				$("#priceFilterSelect").val("all");
			}
		}

		function bindSortEvents() {
			$("#sort-default").off('click').on('click', function() { sortProducts('default'); });
			$("#sort-price-asc").off('click').on('click', function() { sortProducts('price-asc'); });
			$("#sort-price-desc").off('click').on('click', function() { sortProducts('price-desc'); });
			$("#sort-sales").off('click').on('click', function() { sortProducts('sales'); });
		}

		$(function() {
			$(".header").load("./components/head.html");
			$(".footer").load("./components/footer.html");
			$(".middleNavigation").load("./components/middleNavigationBar.html");
			initPriceSelect();
			setActiveFilter();
			bindSortEvents(); // 确保排序事件绑定
			searchByTitle(num, 12, title, currentMinPrice, currentMaxPrice);
		});
	</script>
</head>

<body>
<div class="header"></div>
<div class="middleNavigation"></div>

<div class="container search-container">
	<div class="row">
		<div class="col-md-10 col-md-offset-1">
			<!-- 搜索头部：排序栏 + 筛选下拉框 -->
			<div class="search-header">
				<div class="sort-bar">
					<button id="sort-default" class="sort-btn active">综合排序</button>
					<button id="sort-price-asc" class="sort-btn">价格升序</button>
					<button id="sort-price-desc" class="sort-btn">价格降序</button>
					<button id="sort-sales" class="sort-btn">销量最多</button>
					<div class="filter-dropdown">
						<select id="priceFilterSelect">
							<option value="all">筛选</option>
							<option value="0-3000">0-3000元</option>
							<option value="3000-6000">3000-6000元</option>
							<option value="6000+">6000元以上</option>
						</select>
					</div>
				</div>
			</div>

			<!-- 商品网格 -->
			<div id="productList" class="row product-grid"></div>

			<!-- 分页 -->
			<div id="PaginationList" class="text-center"></div>
		</div>
	</div>
</div>

<div class="footer"></div>
</body>
</html>
