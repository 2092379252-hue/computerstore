<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="renderer" content="webkit" />
    <title>电脑商城 - 用户登录</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="../bootstrap3/js/holder.js"></script>
    <link href="../bootstrap3/css/bootstrap.css" rel="stylesheet" type="text/css">
    <script src="../bootstrap3/jquery-1.9.1.min.js"></script>
    <script src="../bootstrap3/js/bootstrap.js"></script>
    <link rel="stylesheet" href="../bootstrap3/font-awesome-4.7.0/css/font-awesome.css" />
    <link rel="stylesheet" type="text/css" href="../css/layout.css" />
    <link rel="stylesheet" type="text/css" href="../css/login.css" />
    <script src="../bootstrap3/js/jquery.cookie.js" type="text/javascript" charset="utf-8"></script>
    <script src="../js/someFunction.js" type="text/javascript" charset="utf-8"></script>
    <script type="text/javascript">
        function reFlashImg(imgId) {
            document.getElementById(imgId).src = "/kaptcha/kaptcha-image?timestamp=" + new Date().getTime();
        }

        $(function () {
            let codeTimer = null;

            function showError(text) {
                $("#error-msg").html(text);
            }

            function clearError() {
                $("#error-msg").empty();
            }

            function switchLoginType(type) {
                $(".login-tab").removeClass("active");
                $(".login-tab[data-type='" + type + "']").addClass("active");

                if (type === "password") {
                    $(".password-login-group").show();
                    $(".code-login-group").hide();
                    $(".image-captcha-group").show();
                } else {
                    $(".password-login-group").hide();
                    $(".code-login-group").show();
                    $(".image-captcha-group").hide();
                }

                clearError();
            }

            $(".login-tab").click(function () {
                switchLoginType($(this).data("type"));
            });

            $(".get-code-btn").click(function () {
                const username = $("#username").val().trim();
                if (!username) {
                    showError("请先输入用户名或手机号");
                    return;
                }

                if ($(this).prop("disabled")) {
                    return;
                }

                let count = 60;
                const $button = $(this);
                $button.prop("disabled", true).text(count + "s后重新获取");

                codeTimer = setInterval(function () {
                    count -= 1;
                    if (count <= 0) {
                        clearInterval(codeTimer);
                        $button.prop("disabled", false).text("获取验证码");
                        return;
                    }
                    $button.text(count + "s后重新获取");
                }, 1000);

                alert("验证码已发送");
            });

            $("#btn-login").click(function () {
                const activeType = $(".login-tab.active").data("type");
                const username = $("#username").val().trim();
                const password = $("#password").val().trim();
                const code = $("#code").val().trim();
                const kaptchaCode = $("#kaptchaCode").val().trim();

                clearError();

                if (!username) {
                    showError("请先输入登录信息");
                    return false;
                }

                if (activeType === "password") {
                    if (!password) {
                        showError("请先输入登录信息");
                        return false;
                    }
                    if (!kaptchaCode) {
                        showError("图形验证码不能为空");
                        return false;
                    }
                } else {
                    if (!code) {
                        showError("短信验证码不能为空");
                        return false;
                    }
                }

                $.ajax({
                    url: "/user",
                    type: "get",
                    data: $("#form-login").serialize(),
                    dataType: "json",
                    success: function (res) {
                        if (res.status === 200) {
                            alert("登录成功！");
                            sessionStorage.setItem("user", JSON.stringify(res.data));
                            window.location.href = "index.html";
                        } else {
                            showError(res.message);
                        }
                    },
                    error: function (error) {
                        alert(error.status + "错误,服务器出现故障，请等待攻城狮修复！！");
                    }
                });
            });

            $("#btn-toIndex").click(function () {
                location.href = "index.html";
            });

            switchLoginType("password");
        });
    </script>
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-stage">
            <div class="login-story">
                <a class="login-brand" href="index.html" aria-label="返回电脑商城首页">
                    <img src="../images/index/stumalllogo.png" alt="电脑商城" />
                    <div>
                        <span class="login-brand-kicker">Fresh Picks For Daily Computing</span>
                        <strong>电脑商城</strong>
                    </div>
                </a>
                <div class="login-story-art" aria-hidden="true">
                    <span class="login-orb login-orb-large"></span>
                    <span class="login-orb login-orb-small"></span>
                </div>
            </div>

            <div class="login-panel">
                <div class="login-panel-top">
                    <div>
                        <span class="login-panel-kicker">Account Login</span>
                        <h2>用户登录</h2>
                    </div>
                    <div id="error-msg" class="login-error"></div>
                </div>

                <div class="login-tabs">
                    <button type="button" class="login-tab active" data-type="password">密码登录</button>
                    <button type="button" class="login-tab" data-type="code">短信验证码登录</button>
                </div>

                <form id="form-login" class="login-form" role="form">
                    <div class="login-field">
                        <label for="username">用户名/手机号</label>
                        <input id="username" name="username" type="text" class="form-control" placeholder="请输入用户名或手机号">
                    </div>

                    <div class="login-field password-login-group">
                        <label for="password">密码</label>
                        <div class="login-password-row">
                            <input id="password" name="password" type="password" class="form-control" placeholder="请输入密码">
                            <button type="button" class="login-eye-btn" onclick="showPasswordOrNot('password','img')" aria-label="切换密码显示状态">
                                <img id="img" src="../images/img/open.jpeg" alt="显示或隐藏密码">
                            </button>
                        </div>
                    </div>

                    <div class="login-field code-login-group" style="display:none;">
                        <label for="code">短信验证码</label>
                        <div class="login-code-row">
                            <input id="code" name="code" type="text" class="form-control" placeholder="请输入短信验证码">
                            <button type="button" class="get-code-btn">获取验证码</button>
                        </div>
                    </div>

                    <div class="login-field image-captcha-group">
                        <label for="kaptchaCode">图形验证码</label>
                        <div class="login-captcha-row">
                            <input id="kaptchaCode" name="kaptchaCode" type="text" class="form-control" placeholder="请输入图形验证码">
                            <img id="loginKaptcha" src="/kaptcha/kaptcha-image" onclick="reFlashImg('loginKaptcha')" alt="点击刷新验证码" />
                        </div>
                    </div>

                    <div class="login-actions">
                        <input id="btn-login" class="btn login-submit-btn" type="button" value="登录" />
                        <input id="btn-toIndex" class="btn login-back-btn" type="button" value="返回主页" />
                    </div>

                    <div class="login-bottom-row">
                        <span>还没有账号？</span>
                        <a href="register.html">去注册</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
