<section class="site-nav-bar">
    <div class="container navigation-shell">
        <ul class="navigation-links">
            <li><a data-page="index.html" href="index.html">首页</a></li>
            <li><a data-page="favorites.html" href="favorites.html">收藏清单</a></li>
            <li><a data-page="cart.html" href="cart.html">购物车</a></li>
            <li><a data-page="orders.html" href="orders.html">我的订单</a></li>
            <li><a data-page="userdata.html" href="userdata.html">个人中心</a></li>
        </ul>

        <form id="searchForm" onsubmit="return checkIfHaveVal()" action="/web/search.html" class="navigation-search" role="form">
            <div class="search-shell">
                <span class="fa fa-search search-icon"></span>
                <input type="text" class="form-control" id="search" name="title" placeholder="搜索轻薄本、创作本、办公设备">
                <input type="hidden" id="pageNum" name="pageNum" value="1">
                <input type="hidden" id="pageSize" name="pageSize" value="12">
            </div>
            <button id="toSearch" type="submit" class="btn btn-default nav-search-btn">开始查找</button>
        </form>
    </div>
</section>

<script type="text/javascript">
    $(function () {
        var currentPage = window.location.pathname.split("/").pop() || "index.html";
        if (currentPage === "") {
            currentPage = "index.html";
        }

        $(".navigation-links a").each(function () {
            if ($(this).data("page") === currentPage) {
                $(this).addClass("is-active");
            }
        });
    });

    function checkIfHaveVal() {
        var val = $("#search").val();
        if (val === "") {
            alert("请先输入搜索内容！");
            return false;
        }
        return true;
    }
</script>
