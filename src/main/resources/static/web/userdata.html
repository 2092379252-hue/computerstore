<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="renderer" content="webkit" />
    <title>电脑商城 - 个人资料</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="../bootstrap3/js/holder.js"></script>
    <link href="../bootstrap3/css/bootstrap.css" rel="stylesheet" type="text/css">
    <script src="../bootstrap3/jquery-1.9.1.min.js"></script>
    <script src="../bootstrap3/js/bootstrap.js"></script>
    <link rel="stylesheet" href="../bootstrap3/font-awesome-4.7.0/css/font-awesome.css" />
    <link rel="stylesheet" type="text/css" href="../css/layout.css" />
    <link rel="stylesheet" type="text/css" href="../css/top.css" />
    <link rel="stylesheet" type="text/css" href="../css/footer.css" />
    <style>
        .form-tip { font-size: 12px; color: #999; margin-top: 5px; }
        .loading { display: none; margin-left: 10px; }
    </style>
    <script type="text/javascript">
        $(function () {
            $(".header").load("components/head.html");
            $(".footer").load("components/footer.html");
            $(".middleNavigation").load("components/middleNavigationBar.html");

            function fillUserForm(data) {
                $("#username").val(data.username || "");
                $("#nickname").val(data.nickname || "");
                $("#phone").val(data.phone || "");
                $("#email").val(data.email || "");
                $("#birthday").val(data.birthday || "");

                if (data.gender === 0) {
                    $("#gender-female").prop("checked", true);
                } else {
                    $("#gender-male").prop("checked", true);
                }
            }

            $.ajax({
                url: "/user/queryUser",
                type: "get",
                dataType: "json",
                success: function (res) {
                    if (res.status === 200) {
                        fillUserForm(res.data);
                    }
                },
                error: function () {
                    $("#error-msg").text("服务器异常，无法加载用户信息！");
                }
            });

            $("#btn-reset").click(function () {
                $("#form-change-info")[0].reset();
                $("#error-msg").empty().css("color", "red");
            });

            $("#btn-change-info").click(function () {
                if ($(this).hasClass("disabled")) {
                    return;
                }

                if (!confirm("确定要修改个人资料吗？")) {
                    return;
                }

                const nickname = $("#nickname").val().trim();
                const phone = $("#phone").val().trim();
                const email = $("#email").val().trim();

                if (!nickname) {
                    $("#error-msg").text("昵称不能为空！");
                    return false;
                }
                if (!phone) {
                    $("#error-msg").text("手机号不能为空！");
                    return false;
                }
                if (!email) {
                    $("#error-msg").text("邮箱不能为空！");
                    return false;
                }

                const checkPhone = /^[1][3-9][0-9]{9}$/;
                if (!checkPhone.test(phone)) {
                    $("#error-msg").text("手机号格式不正确（13-19开头的11位数字）！");
                    return false;
                }

                const checkEmail = /^\w+([-+.]\w+)*@\w+([-.]\w+)*\.\w+([-.]\w+)*$/;
                if (!checkEmail.test(email)) {
                    $("#error-msg").text("邮箱格式不正确（例：user@example.com）！");
                    return false;
                }

                $(this).addClass("disabled").val("提交中...");
                $(".loading").show();

                $.ajax({
                    url: "/user/updateInfo",
                    type: "post",
                    data: $("#form-change-info").serialize(),
                    dataType: "json",
                    success: function (res) {
                        if (res.status === 200) {
                            $("#error-msg").text("修改成功！").css("color", "#00aa55");
                            sessionStorage.setItem("user", JSON.stringify(res.data));
                            fillUserForm(res.data);
                        } else {
                            $("#error-msg").text(res.message || "修改失败！").css("color", "red");
                        }
                    },
                    error: function () {
                        $("#error-msg").text("服务器异常，修改失败！").css("color", "red");
                    },
                    complete: function () {
                        $("#btn-change-info").removeClass("disabled").val("修改");
                        $(".loading").hide();
                    }
                });
            });
        });
    </script>
</head>
<body>
    <div class="header"></div>
    <div class="middleNavigation"></div>

    <div class="container">
        <div class="col-md-2">
            <div class="panel-group" id="accordion">
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <p class="panel-title">
                            <a data-toggle="collapse" data-parent="#accordion" href="#collapseOne">我的订单</a>
                        </p>
                    </div>
                    <div id="collapseOne" class="panel-collapse collapse">
                        <div class="panel-body">
                            <div><a href="orders.html">全部订单</a></div>
                            <div><a href="orders.html">待付款</a></div>
                            <div><a href="orders.html">待收货</a></div>
                            <div><a href="orders.html">待评价</a></div>
                            <div><a href="orders.html">退货退款</a></div>
                        </div>
                    </div>
                </div>
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <p class="panel-title">
                            <a data-toggle="collapse" data-parent="#accordion" href="#collapseTwo">资料修改</a>
                        </p>
                    </div>
                    <div id="collapseTwo" class="panel-collapse collapse in">
                        <div class="panel-body">
                            <div><a href="password.html">修改密码</a></div>
                            <div><a href="userdata.html"><b>个人资料</b></a></div>
                            <div><a href="upload.html">上传头像</a></div>
                            <div><a href="address.html">收货管理</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-10">
            <div class="panel panel-default">
                <ul class="nav nav-tabs">
                    <li><a href="password.html">修改密码</a></li>
                    <li class="active"><a href="#">个人资料</a></li>
                    <li><a href="upload.html">上传头像</a></li>
                    <li><a href="address.html">收货管理</a></li>
                </ul>
                <div class="panel-body">
                    <form id="form-change-info" class="form-horizontal" role="form">
                        <div class="form-group">
                            <label class="col-md-2 control-label">用户名：</label>
                            <div class="col-md-8">
                                <input id="username" name="username" type="text" class="form-control" placeholder="用户名" readonly>
                                <div class="form-tip">用户名不可修改</div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-2 control-label">昵称：</label>
                            <div class="col-md-8">
                                <input id="nickname" name="nickname" type="text" class="form-control" placeholder="请输入昵称（2-10个字符）">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-2 control-label">电话号码：</label>
                            <div class="col-md-8">
                                <input id="phone" name="phone" type="text" class="form-control" placeholder="请输入11位手机号">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-2 control-label">电子邮箱：</label>
                            <div class="col-md-8">
                                <input id="email" name="email" type="email" class="form-control" placeholder="请输入电子邮箱">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-2 control-label">生日：</label>
                            <div class="col-md-8">
                                <input id="birthday" name="birthday" type="date" class="form-control">
                            </div>
                        </div>
                        <div id="sex" class="form-group">
                            <label class="col-md-2 control-label">性别：</label>
                            <div class="col-md-8">
                                <label class="radio-inline">
                                    <input id="gender-male" type="radio" name="gender" value="1">男
                                </label>
                                <label class="radio-inline">
                                    <input id="gender-female" type="radio" name="gender" value="0">女
                                </label>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-offset-2 col-sm-1">
                                <input id="btn-change-info" type="button" class="btn btn-primary" value="修改" />
                                <span class="loading"><i class="fa fa-spinner fa-spin"></i></span>
                            </div>
                            <div class="col-sm-2">
                                <input id="btn-reset" type="button" class="btn btn-default" value="重置" />
                            </div>
                            <div id="error-msg" class="col-sm-6" style="color: red;font-weight:bold;padding-top: 5px"></div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="clearfix"></div>
    <div class="footer"></div>
</body>
</html>
