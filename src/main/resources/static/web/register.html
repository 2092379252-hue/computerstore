<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="renderer" content="webkit" />
    <title>电脑商城 - 用户注册</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="../bootstrap3/js/holder.js"></script>
    <link href="../bootstrap3/css/bootstrap.css" rel="stylesheet" type="text/css">
    <script src="../bootstrap3/jquery-1.9.1.min.js"></script>
    <script src="../bootstrap3/js/bootstrap.js"></script>
    <link rel="stylesheet" href="../bootstrap3/font-awesome-4.7.0/css/font-awesome.css" />
    <link rel="stylesheet" type="text/css" href="../css/layout.css" />
    <link rel="stylesheet" type="text/css" href="../css/login.css" />
    <script type="text/javascript">
        $(function () {
            function showError(el, text) {
                el.siblings(".error-tip").text(text).show();
                el.addClass("error");
            }

            function hideError(el) {
                el.siblings(".error-tip").text("").hide();
                el.removeClass("error");
            }

            $("input[name='password']").on("input", function () {
                const val = $(this).val();
                const strengthBar = $(".strength-bar");
                const strengthText = $(".strength-text");
                let strength = 0;

                if (val.length >= 6) strength++;
                if (/[A-Z]/.test(val)) strength++;
                if (/[0-9]/.test(val)) strength++;
                if (/[^a-zA-Z0-9]/.test(val)) strength++;

                if (val.length === 0) {
                    strengthBar.css("width", "0%").removeClass("medium strong");
                    strengthText.text("密码强度");
                } else if (strength === 1) {
                    strengthBar.css("width", "25%").removeClass("medium strong");
                    strengthText.text("密码强度：弱");
                } else if (strength === 2 || strength === 3) {
                    strengthBar.css("width", "60%").addClass("medium").removeClass("strong");
                    strengthText.text("密码强度：中");
                } else {
                    strengthBar.css("width", "100%").addClass("strong").removeClass("medium");
                    strengthText.text("密码强度：强");
                }
            });

            $("input[name='username']").on("blur", function () {
                const val = $(this).val().trim();
                if (!val) {
                    hideError($(this));
                    return;
                }
                if (val.length < 4) {
                    showError($(this), "账号长度不能少于4位");
                } else {
                    hideError($(this));
                }
            });

            $("input[name='password']").on("blur", function () {
                const val = $(this).val().trim();
                if (!val) {
                    hideError($(this));
                    return;
                }
                if (val.length < 6) {
                    showError($(this), "密码长度不能少于6位");
                } else {
                    hideError($(this));
                }
            });

            $("input[name='phone']").on("blur", function () {
                const val = $(this).val().trim();
                if (!val) {
                    hideError($(this));
                    return;
                }
                if (!/^1[3-9]\d{9}$/.test(val)) {
                    showError($(this), "请输入正确的手机号格式");
                } else {
                    hideError($(this));
                }
            });

            $("#regForm").on("submit", function (e) {
                e.preventDefault();
                $("input[name='username']").trigger("blur");
                $("input[name='password']").trigger("blur");
                $("input[name='phone']").trigger("blur");

                if ($(".error-tip:visible").length > 0) {
                    return;
                }

                const $submitBtn = $(".register-submit-btn");
                $submitBtn.addClass("is-loading").prop("disabled", true);
                $submitBtn.find(".register-submit-text").hide();
                $submitBtn.find(".register-loading-text").show();

                setTimeout(function () {
                    alert("注册成功！即将跳转到登录页");
                    window.location.href = "login.html";
                }, 1200);
            });

            $("#btn-reset").on("click", function () {
                $("#regForm")[0].reset();
                $(".error-tip").text("").hide();
                $("input").removeClass("error");
                $(".strength-bar").css("width", "0%").removeClass("medium strong");
                $(".strength-text").text("密码强度");
                $(".register-submit-btn").removeClass("is-loading").prop("disabled", false);
                $(".register-submit-text").show();
                $(".register-loading-text").hide();
            });
        });
    </script>
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-stage">
            <div class="login-story">
                <a class="login-brand" href="index.html" aria-label="返回电脑商城首页">
                    <img src="../images/index/stumalllogo.png" alt="电脑商城" />
                    <div>
                        <span class="login-brand-kicker">Fresh Picks For Daily Computing</span>
                        <strong>电脑商城</strong>
                    </div>
                </a>
                <div class="login-story-art" aria-hidden="true">
                    <span class="login-orb login-orb-large"></span>
                    <span class="login-orb login-orb-small"></span>
                </div>
            </div>

            <div class="login-panel register-panel">
                <div class="login-panel-top">
                    <div>
                        <span class="login-panel-kicker">Create Account</span>
                        <h2>用户注册</h2>
                    </div>
                </div>

                <form id="regForm" class="login-form register-form" role="form">
                    <div class="login-field">
                        <label for="reg-username">账号</label>
                        <input id="reg-username" name="username" type="text" class="form-control" placeholder="设置账号" autocomplete="off">
                        <div class="error-tip"></div>
                    </div>

                    <div class="login-field">
                        <label for="reg-password">密码</label>
                        <input id="reg-password" name="password" type="password" class="form-control" placeholder="设置密码" autocomplete="off">
                        <div class="error-tip"></div>
                        <div class="register-strength">
                            <div class="strength-bar"></div>
                            <span class="strength-text">密码强度</span>
                        </div>
                    </div>

                    <div class="login-field">
                        <label for="reg-phone">手机号</label>
                        <input id="reg-phone" name="phone" type="text" class="form-control" placeholder="输入手机号" autocomplete="off">
                        <div class="error-tip"></div>
                    </div>

                    <div class="login-actions register-actions">
                        <button type="submit" class="btn login-submit-btn register-submit-btn">
                            <span class="register-submit-text">注册</span>
                            <span class="register-loading-text" style="display:none;">正在注册...</span>
                        </button>
                        <button id="btn-reset" type="reset" class="btn login-back-btn">重置</button>
                    </div>

                    <div class="login-bottom-row">
                        <span>已经有账号？</span>
                        <a href="login.html">去登录</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
