<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="renderer" content="webkit" />
    <title>电脑商城 - 上传头像</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="../bootstrap3/js/holder.js"></script>
    <link href="../bootstrap3/css/bootstrap.css" rel="stylesheet" type="text/css">
    <script src="../bootstrap3/jquery-1.9.1.min.js"></script>
    <script src="../bootstrap3/js/bootstrap.js"></script>
    <link rel="stylesheet" href="../bootstrap3/font-awesome-4.7.0/css/font-awesome.css" />
    <link rel="stylesheet" type="text/css" href="../css/layout.css" />
    <link rel="stylesheet" type="text/css" href="../css/top.css" />
    <link rel="stylesheet" type="text/css" href="../css/footer.css" />
    <script src="../js/jquery-1.8.0.min.js"></script>
    <script src="../js/jquery.form.js"></script>
    <style>
        .preview-box { margin-top: 10px; display: none; }
        .preview-img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 1px solid #ddd; }
        .upload-tip { font-size: 12px; color: #999; margin-top: 5px; }
        .loading { display: none; margin-left: 10px; }
    </style>
    <script type="text/javascript">
        // 图片预览
        function previewImage(file) {
            const tip = $("#upload-tip");
            // 文件类型验证
            const fileTypes = ['image/jpeg', 'image/png', 'image/gif'];
            if (!fileTypes.includes(file.type)) {
                tip.text("仅支持JPG/PNG/GIF格式！").css("color", "#ff4444");
                return false;
            }
            // 文件大小验证（2MB）
            if (file.size > 2 * 1024 * 1024) {
                tip.text("图片大小不能超过2MB！").css("color", "#ff4444");
                return false;
            }
            tip.text("预览图（建议尺寸：200x200）").css("color", "#999");
            
            // 显示预览
            const reader = new FileReader();
            reader.onload = function (e) {
                $("#preview-img").attr("src", e.target.result);
                $(".preview-box").show();
            }
            reader.readAsDataURL(file);
            return true;
        }

        function afterFromSubmit() {
            $("#uploadImg").addClass("disabled").val("上传中...");
            $(".loading").show();
            
            $("#avatar").ajaxSubmit({
                success: function () {
                    $("#upload-tip").text("上传成功！").css("color", "#00cc00");
                    setTimeout(() => location.href = "upload.html", 1500);
                },
                error: function () {
                    $("#upload-tip").text("上传失败，请重试！").css("color", "#ff4444");
                    $("#uploadImg").removeClass("disabled").val("上传");
                    $(".loading").hide();
                }
            });
            return false;
        }

        $(function () {
            // 加载公共组件
            $(".header").load("components/head.html")
            $(".footer").load("components/footer.html")
            $(".middleNavigation").load("components/middleNavigationBar.html")

            // 加载用户头像
            $.ajax({
                url: "/user/queryUser",
                type: "get",
                dataType: "json",
                success: function (res) {
                    if (res.data?.avatar) {
                        $("#img-avatar").attr("src", res.data.avatar);
                    } else {
                        $("#img-avatar").attr("src", "../images/index/user.jpg");
                    }
                },
                error: function (err) {
                    $("#upload-tip").text("加载头像失败！").css("color", "#ff4444");
                }
            })

            // 选择文件触发预览
            $("#photo").change(function () {
                const file = this.files[0];
                if (file) previewImage(file);
            });
        })
    </script>
</head>
<body>
    <!--头部-->
    <div class="header"></div>
    <!--中间导航条-->
    <div class="middleNavigation"></div>

    <div class="container">
        <div class="col-md-2">
            <!--左侧导航-->
            <div class="panel-group" id="accordion">
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <p class="panel-title">
                            <a data-toggle="collapse" data-parent="#accordion" href="#collapseOne">我的订单</a>
                        </p>
                    </div>
                    <div id="collapseOne" class="panel-collapse collapse">
                        <div class="panel-body">
                            <div><a href="orders.html">全部订单</a></div>
                            <div><a href="orders.html">待付款</a></div>
                            <div><a href="orders.html">待收货</a></div>
                            <div><a href="orders.html">待评价</a></div>
                            <div><a href="orders.html">退货退款</a></div>
                        </div>
                    </div>
                </div>
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <p class="panel-title">
                            <a data-toggle="collapse" data-parent="#accordion" href="#collapseTwo">资料修改</a>
                        </p>
                    </div>
                    <div id="collapseTwo" class="panel-collapse collapse in">
                        <div class="panel-body">
                            <div><a href="password.html">修改密码</a></div>
                            <div><a href="userdata.html">个人资料</a></div>
                            <div><a href="upload.html"><b>上传头像</b></a></div>
                            <div><a href="address.html">收货管理</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-10">
            <div class="panel panel-default">
                <ul class="nav nav-tabs">
                    <li><a href="password.html">修改密码</a></li>
                    <li><a href="userdata.html">个人资料</a></li>
                    <li class="active"><a href="#">上传头像</a></li>
                    <li><a href="address.html">收货管理</a></li>
                </ul>
                <div class="panel-body">
                    <!--上传头像表单-->
                    <form id="avatar" action="/file" method="post" enctype="multipart/form-data"
                        onsubmit="return afterFromSubmit()" class="form-horizontal" role="form">
                        <div class="form-group">
                            <label class="col-md-2 control-label">当前头像:</label>
                            <div class="col-md-5">
                                <img id="img-avatar" style="width: 200px;height: 200px;border-radius:50%; overflow:hidden;"
                                    class="img-responsive" />
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-2 control-label">选择新头像:</label>
                            <div class="col-md-5">
                                <input id="photo" type="file" name="file" accept="image/jpeg,image/png,image/gif">
                                <div id="upload-tip" class="upload-tip">支持JPG/PNG/GIF格式，最大2MB</div>
                                <!-- 预览区域 -->
                                <div class="preview-box">
                                    <p style="margin-top: 10px;font-size: 12px;">预览图：</p>
                                    <img id="preview-img" class="preview-img" />
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-offset-2 col-sm-10">
                                <input id="uploadImg" type="submit" class="btn btn-primary" value="上传" />
                                <span class="loading"><i class="fa fa-spinner fa-spin"></i></span>
                            </div>
                        </div>
                    </form>
                    <iframe src="" frameborder="0" name="" style="display: none;"></iframe>
                </div>
            </div>
        </div>
    </div>

    <div class="clearfix"></div>
    <!--页脚-->
    <div class="footer"></div>
</body>
</html>
