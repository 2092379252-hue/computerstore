spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:computer_store}?characterEncoding=utf8&useSSL=false&serverTimezone=UTC&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB

mybatis:
  type-aliases-package: top.year21.computerstore.entity
  mapper-locations: classpath:mybatis/mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

pagehelper:
  dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

server:
  port: 8080
  ip: ${SERVER_IP:127.0.0.1}

app:
  file-upload-dir: ${FILE_UPLOAD_DIR:${user.dir}/uploads/computerstore/}
  file-access-base-url: ${FILE_ACCESS_BASE_URL:http://${server.ip}:${server.port}/file/down/}

alipay:
  app-id: ${ALIPAY_APP_ID:your-app-id}
  app-private-key: ${ALIPAY_APP_PRIVATE_KEY:your-app-private-key}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:your-alipay-public-key}
  notify-url: ${ALIPAY_NOTIFY_URL:http://127.0.0.1:8080/alipay/notifyNotice}
  return-url: ${ALIPAY_RETURN_URL:http://127.0.0.1:8080/alipay/returnNotice}
  sign-type: ${ALIPAY_SIGN_TYPE:RSA2}
  charset: ${ALIPAY_CHARSET:utf-8}
  gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi.alipaydev.com/gateway.do}